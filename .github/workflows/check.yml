name: Sanity check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────
      # WAS `node-version: 20`, AND THAT WAS A REAL MISMATCH:
      # package.json declares "engines": { "node": "22.x" },
      # which is what Vercel runs. CI was testing every push
      # on a runtime the app never executes on.
      # ─────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ─────────────────────────────────────────────────────
      # NEW — Vercel rejects the ENTIRE build if any function
      # filename contains a space. It fails at deploy time, not
      # commit time, so without this it's invisible until
      # something stops working in production.
      # ─────────────────────────────────────────────────────
      - name: API filenames are Vercel-safe
        run: |
          if [ -d api ]; then
            BAD=$(ls api/ | grep ' ' || true)
            if [ -n "$BAD" ]; then
              echo "::error::api/ contains filename(s) with spaces - Vercel will reject the build"
              echo "$BAD"
              exit 1
            fi
          fi
          echo "api/ filenames: OK"

      # ─────────────────────────────────────────────────────
      # NEW — api/package.json sets "type": "module". A single
      # CommonJS file makes EVERY function fail with
      # FUNCTION_INVOCATION_FAILED.
      # ─────────────────────────────────────────────────────
      - name: API functions use ES modules
        run: |
          if [ -d api ]; then
            BAD=$(grep -l 'module\.exports' api/*.js 2>/dev/null || true)
            if [ -n "$BAD" ]; then
              echo "::error::api/ function(s) use module.exports - this breaks ALL functions"
              echo "$BAD"
              exit 1
            fi
          fi
          echo "api/ module style: OK"

      - name: index.html exists and is not truncated
        run: |
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          SIZE=$(wc -c < index.html)
          echo "index.html size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::index.html is only $SIZE bytes - truncated or wrong file (expected ~2.1MB)"
            exit 1
          fi
          tail -c 200 index.html | grep -q "</html>" || { echo "::error::index.html does not end with </html> - truncated upload"; exit 1; }

      # ─────────────────────────────────────────────────────
      # FIXED — the old regex was /<script>...<\/script>/ which
      # only matches a script tag with NO attributes. Every
      # spliced module uses <script id="cr-xxx-script">, so all
      # of them were skipped. It then checked only the single
      # largest block. This checks every inline script.
      # ─────────────────────────────────────────────────────
      - name: Every inline script parses
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html','utf8');
            const blocks = [...src.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if(!blocks.length){ console.error('::error::no inline script blocks found'); process.exit(1); }
            let bad = 0;
            blocks.forEach((b, i) => {
              try { new Function(b); }
              catch (e) { bad++; console.error('::error::syntax error in inline script #' + i + ': ' + e.message); }
            });
            if (bad) process.exit(1);
            console.log('all ' + blocks.length + ' inline scripts parse OK');
          "

      # ─────────────────────────────────────────────────────
      # NEW (1186) — THE BLIND SPOT IN THE STEP ABOVE. Its regex
      # is /<script(?![^>]*\bsrc=)[^>]*>/ — it deliberately skips
      # every tag carrying src=, because for years every module
      # lived inline and the only src= tags were CDN. Correct
      # then; a coverage hole the moment any module moves to its
      # own file, which the Showroom relocation
      # (SHOWROOM_EXTRACTION_SPIKE.md) is about to do. The hole
      # would not break anything loudly — it would report GREEN
      # over an unchecked file, which is the failure shape this
      # project keeps paying for.
      #
      # It also catches the worse case: a src pointing at a file
      # that is not in the repo. That deploys perfectly and 404s
      # in the browser, with nothing red anywhere.
      #
      # ⚠ --selftest FIRST, AND IT IS NOT CEREMONY. Measured
      # 31 Aug 2026: zero local external scripts exist, so over
      # the real artifacts this check has NOTHING to inspect and
      # passes trivially. The selftest is therefore the only
      # thing proving the checker can fail at all — it builds
      # fixtures with a syntax error and with a missing file and
      # requires both to be caught. If it ever stops catching
      # them, this step goes red here, in CI.
      #
      # ONE IMPLEMENTATION, TWO CALLERS: check_build.py shells
      # out to this same script. Do not reimplement it in YAML.
      # ─────────────────────────────────────────────────────
      - name: External <script src> files parse and exist
        run: |
          T=.claude/skills/cardinal-build/scripts/check_external_scripts.mjs
          if [ ! -f "$T" ]; then
            echo "::error::$T is missing - external scripts are unchecked"
            exit 1
          fi
          echo "--- regression proof: the checker still fails on a broken external script"
          node "$T" --selftest || { echo "::error::external-script checker selftest FAILED - it can no longer be trusted"; exit 1; }
          echo "--- the shipped artifacts"
          node "$T" index.html popup.html studio.html supplement.html \
                    ai-field-manual.html drivewaytest.html bulk_assign.html \
                    visualizer/index.html

      - name: Structural balance (CSS braces, divs, scripts)
        run: |
          node -e "
            const src = require('fs').readFileSync('index.html','utf8');
            const styles = [...src.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m => m[1]);
            for (const s of styles) {
              const open = (s.match(/\{/g)||[]).length, close = (s.match(/\}/g)||[]).length;
              if (open !== close) { console.error('::error::CSS braces unbalanced: ' + open + ' vs ' + close); process.exit(1); }
            }
            const dv = (src.match(/<div/g)||[]).length, dc = (src.match(/<\/div>/g)||[]).length;
            if (dv !== dc) { console.error('::error::div tags unbalanced: ' + dv + ' vs ' + dc); process.exit(1); }
            const so = (src.match(/<script/g)||[]).length, sc = (src.match(/<\/script>/g)||[]).length;
            if (so !== sc) { console.error('::error::script tags unbalanced: ' + so + ' vs ' + sc); process.exit(1); }
            console.log('CSS + div + script balance: OK');
          "

      - name: Service worker parses (if present)
        run: |
          if [ -f sw.js ]; then node --check sw.js && echo "sw.js: valid"; else echo "sw.js not present - skipping"; fi

      # ─────────────────────────────────────────────────────
      # NEW (614) — studio.html was shipping to production with
      # NO CI coverage at all. Every step above names index.html
      # explicitly, so a broken Studio deployed green. It is a
      # standalone page with its own sign-in, its own palette and
      # its own Supabase queries; nothing else guards it.
      # Same checks index.html gets: every inline script parses,
      # and the structural balance holds.
      # ─────────────────────────────────────────────────────
      - name: studio.html parses and balances (if present)
        run: |
          if [ ! -f studio.html ]; then echo "studio.html not present - skipping"; exit 0; fi
          node -e "
            const src = require('fs').readFileSync('studio.html','utf8');
            if (src.length < 20000) { console.error('::error::studio.html is only ' + src.length + ' bytes - truncated'); process.exit(1); }
            const blocks = [...src.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!blocks.length) { console.error('::error::studio.html has no inline scripts - wrong file?'); process.exit(1); }
            let bad = 0;
            blocks.forEach((b, i) => {
              try { new Function(b); }
              catch (e) { bad++; console.error('::error::syntax error in studio.html inline script #' + i + ': ' + e.message); }
            });
            if (bad) process.exit(1);
            const styles = [...src.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m => m[1]);
            for (const s of styles) {
              const o = (s.match(/\{/g)||[]).length, c = (s.match(/\}/g)||[]).length;
              if (o !== c) { console.error('::error::studio.html CSS braces unbalanced: ' + o + ' vs ' + c); process.exit(1); }
            }
            const dv = (src.match(/<div/g)||[]).length, dc = (src.match(/<\/div>/g)||[]).length;
            if (dv !== dc) { console.error('::error::studio.html div tags unbalanced: ' + dv + ' vs ' + dc); process.exit(1); }
            const so = (src.match(/<script/g)||[]).length, sc = (src.match(/<\/script>/g)||[]).length;
            if (so !== sc) { console.error('::error::studio.html script tags unbalanced: ' + so + ' vs ' + sc); process.exit(1); }
            console.log('studio.html: ' + blocks.length + ' inline scripts parse, balance OK');
          "

      # ─────────────────────────────────────────────────────
      # FIXED — used to check api/notify.js only. Everything
      # else in that folder could be broken and CI stayed green.
      # ─────────────────────────────────────────────────────
      - name: Every API function parses
        run: |
          if [ -d api ]; then
            FAIL=0
            for f in api/*.js; do
              [ -e "$f" ] || continue
              if ! node --input-type=module --eval "$(cat "$f")" >/dev/null 2>&1; then
                if ! node --check "$f" >/dev/null 2>&1; then
                  echo "::error::$f failed to parse"
                  FAIL=1
                fi
              fi
            done
            [ "$FAIL" -eq 0 ] || exit 1
            echo "api/ functions parse: OK"
          else
            echo "api/ not present - skipping"
          fi

      # ─────────────────────────────────────────────────────
      # NEW — MIGRATIONS.md is generated from the .sql files at
      # the repo root and from the build log. Add a migration and
      # forget to regenerate it and the manifest silently stops
      # describing the database, which is exactly the failure it
      # exists to prevent. Cheap to check, so check it.
      # ─────────────────────────────────────────────────────
      - name: Migration manifest is up to date
        run: |
          if [ -f .claude/skills/cardinal-build/scripts/migration_manifest.py ]; then
            python3 .claude/skills/cardinal-build/scripts/migration_manifest.py --check
          else
            echo "manifest generator not present - skipped"
          fi

      - name: JSON files valid (if present)
        run: |
          for f in manifest.json package.json vercel.json api/package.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "$f: valid"
            fi
          done

      - name: Push keys match between app and API (if both present)
        run: |
          if [ -f api/notify.js ]; then
            node -e "
              const fs = require('fs');
              const app = fs.readFileSync('index.html','utf8');
              const api = fs.readFileSync('api/notify.js','utf8');
              // FIXED (608) — this used String.match WITHOUT /g, so it read only the
              // FIRST VAPID_PUBLIC in index.html. The file had TWO, with different
              // keys, and the second one fed the very table api/notify.js reads.
              // The gate compared first-vs-first, matched, and passed for as long as
              // push was silently broken. Check EVERY copy. Do not narrow this again.
              const all = [...app.matchAll(/VAPID_PUBLIC = '([^']+)'/g)].map(m => m[1]);
              const a = all[0];
              const b = (api.match(/VAPID_PUBLIC = '([^']+)'/)||[])[1];
              const odd = [...new Set(all)].filter(k => k !== b);
              if(b && odd.length){
                console.error('::error::index.html has ' + new Set(all).size + ' distinct VAPID public keys; '
                  + odd.length + ' differ from api/notify.js - those subscriptions can never receive a push');
                process.exit(1);
              }
              console.log('VAPID: ' + all.length + ' declaration(s) in index.html, '
                + new Set(all).size + ' distinct, all matching api/notify.js');
              if(a && b && a !== b){ console.error('::error::VAPID public keys differ between index.html and api/notify.js - push will fail'); process.exit(1); }
              console.log('VAPID keys: ' + (a && b ? 'matched' : 'not applicable'));
            "
          fi

  # ═══════════════════════════════════════════════════════════
  # NEW — the harnesses run in CI at last, on node 22.
  #
  # THE GAP: these six were covered by NOTHING here. jsdom was
  # never a repo dependency (it lived in a session scratchpad),
  # and the job pinned node 20 — on which jsdom 30 does not run
  # at all. Its own engines field says
  # "^22.22.2 || ^24.15.0 || >=26.0.0". On node 20 every one of
  # them dies inside jsdom before its first assertion: a silent
  # zero, which is strictly worse than a red.
  #
  # WHY NOT "pin a compatible jsdom": that pins BACKWARDS to
  # accommodate a CI runtime production does not use. Vercel
  # runs node 22 (package.json engines). The runtime was the
  # thing that was wrong.
  #
  # RATCHETED, because four of the six are RED on main today for
  # reasons that predate this job. The known failures are
  # baselined BY NAME in harness_baseline.json and printed on
  # every run; a NEW one is red the build it lands. The
  # alternative was bending or deleting real assertions.
  #
  # ⚠ NOT COVERED HERE: gate_983, gate_1076, harness_occhead and
  # audit_contrast drive Chromium through playwright. Installing
  # a browser in CI is a separate decision with its own failure
  # modes; claiming them as covered would be a lie this job
  # cannot honour.
  # ═══════════════════════════════════════════════════════════
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --no-save on purpose: package.json is production config that
      # Vercel reads, and a test-only dependency does not belong in it.
      # Pinned exactly so a jsdom release cannot silently change a verdict.
      - name: Install jsdom (test-only, pinned, not saved)
        run: npm install --no-save --no-audit --no-fund jsdom@30.0.1

      # ⚠ THE GATE'S OWN NEGATIVE CONTROL, RUN FIRST AND IN CI.
      # A ratcheted gate that has never been seen to fail is a gate that
      # has quietly baselined everything. This proves, on this runner,
      # that a new failure goes red, that a harness which stops asserting
      # goes red, and that a dropped harness goes red.
      - name: The harness gate can fail (selftest)
        run: |
          node .claude/skills/cardinal-build/scripts/gate_harnesses.mjs --selftest

      # ⚠ SECOND NEGATIVE CONTROL — END TO END, ON A POISONED ARTIFACT.
      # The selftest exercises the comparison in isolation; this proves the
      # whole job fails when the real thing breaks. It corrupts the Showcase
      # public-API assignment in a COPY of index.html (never the real file)
      # and requires a non-zero exit.
      #   It also demonstrates why the pass-count rule exists: this break makes
      # harness_showcase's three baselined failures DISAPPEAR, because the
      # harness bails out early. A gate watching only the FAIL count would have
      # scored that as an improvement.
      - name: A broken module actually fails this job (end-to-end control)
        run: |
          cp index.html /tmp/poisoned.html
          node -e "
            const fs=require('fs');
            const p='/tmp/poisoned.html';
            const s=fs.readFileSync(p,'utf8');
            const m='window.CardinalShowcase = Object.assign(window.CardinalShowcase';
            if(s.split(m).length-1 !== 1){ console.error('::error::control anchor is not unique - the control would be vacuous'); process.exit(1); }
            fs.writeFileSync(p, s.replace(m,'window.CardinalShowcase = Object.NOPE(window.CardinalShowcase'));
          "
          if node .claude/skills/cardinal-build/scripts/gate_harnesses.mjs /tmp/poisoned.html studio.html > /tmp/ctl.log 2>&1; then
            echo "::error::the harness gate stayed GREEN on a deliberately broken Showcase - it proves nothing"
            cat /tmp/ctl.log
            exit 1
          fi
          echo "control OK - the gate went red on a broken module:"
          grep -E '^::error::' /tmp/ctl.log || true
          rm -f /tmp/poisoned.html /tmp/ctl.log

      - name: Harnesses (ratcheted against harness_baseline.json)
        run: |
          node .claude/skills/cardinal-build/scripts/gate_harnesses.mjs

  # ═══════════════════════════════════════════════════════════
  # The Chromium gates, including the original four brought into CI.
  #
  # "Not covered" understated it. Three of the four hard-coded a
  # browser path inside the sandbox they were written in — and
  # two DIFFERENT paths at that — so they died at launch on any
  # other machine, before their first assertion. A fourth,
  # audit_contrast, had self-disabled for months over fixtures
  # that were never committed, printing an honest "NOT RUN" and
  # auditing nothing. Two of the four could not have run
  # anywhere but one laptop.
  #
  # Fixed: chromium_launch.cjs resolves the browser ($PW_CHROMIUM
  # -> known sandbox paths -> Playwright's own), and the OC colour
  # fixtures are committed under scripts/fixtures/ — recovered
  # from harness_colors, which already carried a real-shaped set,
  # rather than invented.
  #
  # NO BASELINE HERE, deliberately: every gate is green on the
  # shipped file, so the honest ratchet is zero. A baseline file
  # would only be somewhere for a future failure to hide.
  # ═══════════════════════════════════════════════════════════
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --no-save: package.json is production config Vercel reads.
      # Pinned so a release cannot silently change a verdict.
      - name: Install Playwright and jsdom (test-only, pinned, not saved)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 jsdom@30.0.1
          npx playwright install --with-deps chromium

      # ⚠ THE RUNNER'S OWN CONTROL, FIRST. It proves every break
      # anchor still matches something in the artifact. A negative
      # control whose anchor matches nothing "passes" by doing
      # nothing — that has already happened twice on this project.
      - name: The break anchors still match (selftest)
        run: node .claude/skills/cardinal-build/scripts/gate_chromium.mjs --selftest

      # Runs each gate twice: once on the shipped file, where it
      # must pass, and once on a copy where the specific thing that
      # gate protects has been broken, where it must go red. Browser
      # gates that have only ever been seen to pass prove nothing.
      - name: Chromium gates + negative controls
        run: node .claude/skills/cardinal-build/scripts/gate_chromium.mjs
