<style id="cr-scan-styles">
/* 1390: the document scanner — a camera tool, one dark design in both themes */
#cr-scan{position:fixed;inset:0;z-index:100050;background:#0b0c0e;color:#eceef0;display:none;flex-direction:column;
  font:400 15px/1.35 -apple-system,'Segoe UI',Arial,sans-serif;}
#cr-scan.open{display:flex;}
#cr-scan .scn-top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid #24272d;}
#cr-scan .scn-top b{flex:1;font:800 15px/1.2 -apple-system,'Segoe UI',Arial,sans-serif;}
#cr-scan .scn-stage{flex:1;position:relative;overflow:hidden;touch-action:none;}
#cr-scan .scn-stage canvas{position:absolute;left:0;top:0;}
#cr-scan .scn-h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;touch-action:none;}
#cr-scan .scn-h::after{content:'';position:absolute;left:12px;top:12px;width:20px;height:20px;border-radius:50%;
  background:rgba(200,32,46,.35);border:2px solid #fff;box-shadow:0 0 0 2px #C8202E;}
#cr-scan .scn-bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid #24272d;}
#cr-scan .scn-seg{display:flex;gap:6px;width:100%;}
#cr-scan button{min-height:44px;border-radius:10px;border:1px solid #3a3d46;background:transparent;color:#eceef0;
  font:600 15px/1 -apple-system,'Segoe UI',Arial,sans-serif;padding:0 14px;cursor:pointer;}
#cr-scan .scn-seg button{flex:1;}
#cr-scan button.on{background:#2a2d34;border-color:#8a8f99;}
#cr-scan button.primary{background:#C8202E;border-color:#C8202E;color:#fff;flex:1;}
#cr-scan .scn-note{width:100%;font:400 13px/1.35 -apple-system,'Segoe UI',Arial,sans-serif;color:#a9aeb7;}
#cr-scan .scn-thumbs{display:flex;gap:6px;overflow-x:auto;width:100%;}
#cr-scan .scn-thumbs img{height:56px;border-radius:6px;border:1px solid #3a3d46;background:#fff;}
#cr-scan .scn-busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,12,14,.7);font:600 15px/1.3 -apple-system,'Segoe UI',Arial,sans-serif;}
#cr-scan.busy .scn-busy{display:flex;}
</style>
<script id="cr-scan-script">
/* 1390 — the document scanner (Theo, 22 Oct: "please allow us to actually scan documents also. Right now its
   the same as taking a photo"). Scan document used to file the raw camera photo. Now each photo opens here:
   the page edges are found (bright paper on a darker ground; drag any corner to fix it), the page is
   straightened to a flat rectangle, cleaned up (Document: shadows lifted and the paper whitened; Gray; or
   Color), and Add page takes the next one. Done writes ONE PDF of every page and files it on the job like
   any upload. Nothing leaves the phone until Done, and the original photos are not kept.
   The PDF is written here (JPEG pages, DCTDecode) — no library, nothing fetched. */
(function(){
'use strict';
var ROOT = null, pages = [], cur = null, onDone = null, mode = 'doc', camInput = null;
function scnEl(t, c, h){ var e = document.createElement(t); if(c) e.className = c; if(h != null) e.innerHTML = h; return e; }
function scnBuild(){
  if(ROOT) return ROOT;
  ROOT = scnEl('div'); ROOT.id = 'cr-scan'; ROOT.setAttribute('role', 'dialog'); ROOT.setAttribute('aria-label', 'Scan document');
  ROOT.innerHTML =
    '<div class="scn-top"><b>Scan document</b><button type="button" data-scn="cancel">Cancel</button></div>' +
    '<div class="scn-stage"><canvas></canvas><div class="scn-busy">Working…</div></div>' +
    '<div class="scn-bar">' +
      '<div class="scn-note">Drag the red corners to the corners of the page.</div>' +
      '<div class="scn-seg" role="group" aria-label="Look">' +
        '<button type="button" data-scnmode="doc" class="on">Document</button>' +
        '<button type="button" data-scnmode="gray">Gray</button>' +
        '<button type="button" data-scnmode="color">Color</button>' +
      '</div>' +
      '<div class="scn-thumbs"></div>' +
      '<div class="scn-seg">' +
        '<button type="button" data-scn="rotate">Rotate</button>' +
        '<button type="button" data-scn="retake">Retake</button>' +
        '<button type="button" data-scn="add">Add page</button>' +
      '</div>' +
      '<button type="button" class="primary" data-scn="done">Save PDF</button>' +
    '</div>';
  document.body.appendChild(ROOT);
  camInput = scnEl('input'); camInput.type = 'file'; camInput.accept = 'image/*';
  camInput.setAttribute('capture', 'environment'); camInput.style.display = 'none';
  camInput.addEventListener('change', function(){
    var f = camInput.files && camInput.files[0]; camInput.value = '';
    if(f) scnLoadPhoto(f);
  });
  ROOT.appendChild(camInput);
  ROOT.addEventListener('click', function(e){
    var t = /** @type {any} */ (e.target);
    var m = t.closest && t.closest('[data-scnmode]');
    if(m){ mode = m.getAttribute('data-scnmode'); ROOT.querySelectorAll('[data-scnmode]').forEach(function(b){ b.classList.toggle('on', b === m); }); return; }
    var a = t.closest && t.closest('[data-scn]'); if(!a) return;
    var act = a.getAttribute('data-scn');
    if(act === 'cancel') scnClose();
    else if(act === 'retake'){ cur = null; camInput.click(); }
    else if(act === 'rotate' && cur){ cur.rot = (cur.rot + 90) % 360;
      var nt = ROOT.querySelector('.scn-note'); if(nt) nt.textContent = cur.rot ? 'This page will be turned ' + cur.rot + '\u00b0 in the PDF.' : 'Drag the red corners to the corners of the page.'; }
    else if(act === 'add'){ if(cur) scnKeep().then(function(){ camInput.click(); }); else camInput.click(); }
    else if(act === 'done') scnFinish();
  });
  window.addEventListener('popstate', function(){ if(ROOT && ROOT.classList.contains('open')) scnClose(); });
  window.addEventListener('resize', function(){ if(cur) scnLayout(); });
  return ROOT;
}
function scnBusy(on){ ROOT.classList.toggle('busy', !!on); }
function scnReadImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ res(im); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000); };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('could not read the photo')); };
    im.src = url;
  });
}
/* the working copy: long side at most 2400px (enough for a crisp letter page, small enough to move fast) */
function scnWorkCanvas(im){
  var s = Math.min(1, 2400 / Math.max(im.naturalWidth, im.naturalHeight));
  var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  var x = /** @type {CanvasRenderingContext2D} */ (c.getContext('2d')); x.drawImage(im, 0, 0, c.width, c.height);
  return c;
}
/* Edges: bright paper on a darker ground. Otsu's threshold on a small gray copy, the largest bright blob,
   and its four extreme points (min/max of x+y and x-y). If it finds nothing page-sized, an inset frame. */
function scnFindCorners(c){
  var W = 320, s = W / c.width, H = Math.max(1, Math.round(c.height * s));
  var t = document.createElement('canvas'); t.width = W; t.height = H;
  var x = /** @type {CanvasRenderingContext2D} */ (t.getContext('2d')); x.drawImage(c, 0, 0, W, H);
  var d = x.getImageData(0, 0, W, H).data, g = new Uint8Array(W * H), hist = new Array(256).fill(0), i;
  for(i = 0; i < W * H; i++){ var v = (d[i*4] * 0.299 + d[i*4+1] * 0.587 + d[i*4+2] * 0.114) | 0; g[i] = v; hist[v]++; }
  var tot = W * H, sum = 0, sumB = 0, wB = 0, best = 0, th = 128;
  for(i = 0; i < 256; i++) sum += i * hist[i];
  for(i = 0; i < 256; i++){ wB += hist[i]; if(!wB) continue; var wF = tot - wB; if(!wF) break;
    sumB += i * hist[i]; var mB = sumB / wB, mF = (sum - sumB) / wF, bt = wB * wF * (mB - mF) * (mB - mF);
    if(bt > best){ best = bt; th = i; } }
  var lab = new Int32Array(W * H), stack = [], bestN = 0, bestL = 0, L = 0;
  for(i = 0; i < W * H; i++){
    if(g[i] <= th || lab[i]) continue;
    L++; var n = 0; stack.push(i); lab[i] = L;
    while(stack.length){ var p = stack.pop(), px = p % W, py = (p / W) | 0; n++;
      if(px > 0 && !lab[p-1] && g[p-1] > th){ lab[p-1] = L; stack.push(p-1); }
      if(px < W-1 && !lab[p+1] && g[p+1] > th){ lab[p+1] = L; stack.push(p+1); }
      if(py > 0 && !lab[p-W] && g[p-W] > th){ lab[p-W] = L; stack.push(p-W); }
      if(py < H-1 && !lab[p+W] && g[p+W] > th){ lab[p+W] = L; stack.push(p+W); } }
    if(n > bestN){ bestN = n; bestL = L; }
  }
  var inset = function(){ var mx = c.width * 0.06, my = c.height * 0.06;
    return [[mx, my], [c.width - mx, my], [c.width - mx, c.height - my], [mx, c.height - my]]; };
  if(bestN < tot * 0.12 || bestN > tot * 0.97) return inset();
  var tl = null, tr = null, br = null, bl = null, a = Infinity, b = -Infinity, e2 = -Infinity, f = Infinity;
  for(i = 0; i < W * H; i++){ if(lab[i] !== bestL) continue; var X = i % W, Y = (i / W) | 0;
    if(X + Y < a){ a = X + Y; tl = [X, Y]; } if(X + Y > b){ b = X + Y; br = [X, Y]; }
    if(X - Y > e2){ e2 = X - Y; tr = [X, Y]; } if(X - Y < f){ f = X - Y; bl = [X, Y]; } }
  return [tl, tr, br, bl].map(function(q){ return [q[0] / s, q[1] / s]; });
}
async function scnLoadPhoto(file){
  scnBusy(true);
  try{
    var im = await scnReadImage(file);
    var c = scnWorkCanvas(im);
    cur = { src: c, q: scnFindCorners(c), rot: 0 };
    scnLayout();
  }catch(err){ scnTell('Could not read that photo: ' + ((err && err.message) || err)); }
  scnBusy(false);
}
var view = { s: 1, ox: 0, oy: 0 };
function scnLayout(){
  var stage = /** @type {HTMLElement} */ (ROOT.querySelector('.scn-stage')), cv = /** @type {HTMLCanvasElement} */ (stage.querySelector('canvas'));
  ROOT.querySelectorAll('.scn-h').forEach(function(h){ h.remove(); });
  if(!cur){ cv.width = 0; return; }
  var W = stage.clientWidth, H = stage.clientHeight, s = Math.min(W / cur.src.width, H / cur.src.height) * 0.94;
  view = { s: s, ox: (W - cur.src.width * s) / 2, oy: (H - cur.src.height * s) / 2 };
  cv.width = W; cv.height = H; scnDraw();
  cur.q.forEach(function(pt, k){
    var h = scnEl('div', 'scn-h'); h.setAttribute('role', 'slider'); h.setAttribute('aria-label', ['Top left', 'Top right', 'Bottom right', 'Bottom left'][k] + ' corner');
    scnPlace(h, pt); stage.appendChild(h);
    h.addEventListener('pointerdown', function(ev){
      ev.preventDefault(); h.setPointerCapture(ev.pointerId);
      var mv = function(e){ var r = stage.getBoundingClientRect();
        var X = Math.max(0, Math.min(cur.src.width, (e.clientX - r.left - view.ox) / view.s));
        var Y = Math.max(0, Math.min(cur.src.height, (e.clientY - r.top - view.oy) / view.s));
        cur.q[k] = [X, Y]; scnPlace(h, cur.q[k]); scnDraw(); };
      var up = function(){ h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  });
}
function scnPlace(h, pt){ h.style.left = (view.ox + pt[0] * view.s) + 'px'; h.style.top = (view.oy + pt[1] * view.s) + 'px'; }
function scnDraw(){
  var cv = /** @type {HTMLCanvasElement} */ (ROOT.querySelector('.scn-stage canvas')), x = /** @type {CanvasRenderingContext2D} */ (cv.getContext('2d'));
  x.clearRect(0, 0, cv.width, cv.height);
  x.drawImage(cur.src, view.ox, view.oy, cur.src.width * view.s, cur.src.height * view.s);
  x.beginPath(); cur.q.forEach(function(p, k){ var X = view.ox + p[0] * view.s, Y = view.oy + p[1] * view.s; if(k) x.lineTo(X, Y); else x.moveTo(X, Y); });
  x.closePath(); x.lineWidth = 2; x.strokeStyle = '#C8202E'; x.fillStyle = 'rgba(200,32,46,.12)'; x.fill(); x.stroke();
}
/* homography: the 3x3 that maps the unit square onto the quad (Heckbert's square-to-quad) */
function scnSq2quad(q){
  var x0 = q[0][0], y0 = q[0][1], x1 = q[1][0], y1 = q[1][1], x2 = q[2][0], y2 = q[2][1], x3 = q[3][0], y3 = q[3][1];
  var dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2, sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  var g = 0, h = 0, den = dx1 * dy2 - dx2 * dy1;
  if(Math.abs(den) > 1e-9){ g = (sx * dy2 - dx2 * sy) / den; h = (dx1 * sy - sx * dy1) / den; }
  return [x1 - x0 + g * x1, x3 - x0 + h * x3, x0, y1 - y0 + g * y1, y3 - y0 + h * y3, y0, g, h];
}
function scnDist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
/* flatten + clean one page into a canvas */
function scnRender(p, look){
  var q = p.q, wOut = Math.max(scnDist(q[0], q[1]), scnDist(q[3], q[2])), hOut = Math.max(scnDist(q[0], q[3]), scnDist(q[1], q[2]));
  var k = Math.min(1, 2200 / Math.max(wOut, hOut)); wOut = Math.max(8, Math.round(wOut * k)); hOut = Math.max(8, Math.round(hOut * k));
  var sw = p.src.width, sh = p.src.height, sd = (/** @type {CanvasRenderingContext2D} */ (p.src.getContext('2d'))).getImageData(0, 0, sw, sh).data;
  var out = document.createElement('canvas'); out.width = wOut; out.height = hOut;
  var ox = /** @type {CanvasRenderingContext2D} */ (out.getContext('2d')), od = ox.createImageData(wOut, hOut), o = od.data;
  var m = scnSq2quad(q), a = m[0], b = m[1], c = m[2], d = m[3], e = m[4], f = m[5], g = m[6], h = m[7];
  for(var y = 0; y < hOut; y++){ var v = (y + 0.5) / hOut;
    for(var x = 0; x < wOut; x++){ var u = (x + 0.5) / wOut, w = g * u + h * v + 1;
      var X = (a * u + b * v + c) / w, Y = (d * u + e * v + f) / w;
      var xi = X | 0, yi = Y | 0, fx = X - xi, fy = Y - yi; if(xi < 0) xi = 0; if(yi < 0) yi = 0; if(xi > sw - 2) xi = sw - 2; if(yi > sh - 2) yi = sh - 2;
      var i00 = (yi * sw + xi) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4, di = (y * wOut + x) * 4;
      for(var ch = 0; ch < 3; ch++){
        o[di + ch] = (sd[i00 + ch] * (1 - fx) + sd[i10 + ch] * fx) * (1 - fy) + (sd[i01 + ch] * (1 - fx) + sd[i11 + ch] * fx) * fy; }
      o[di + 3] = 255; } }
  if(look !== 'color') scnClean(o, wOut, hOut, look === 'doc');
  ox.putImageData(od, 0, 0);
  if(!p.rot) return out;
  var r = document.createElement('canvas'), turn = p.rot % 180 !== 0; r.width = turn ? hOut : wOut; r.height = turn ? wOut : hOut;
  var rx = /** @type {CanvasRenderingContext2D} */ (r.getContext('2d')); rx.translate(r.width / 2, r.height / 2); rx.rotate(p.rot * Math.PI / 180); rx.drawImage(out, -wOut / 2, -hOut / 2);
  return r;
}
/* Gray / Document: gray, then divide by a blurred copy of itself (the paper's own shading) so shadows and
   uneven light lift to white; Document also deepens the ink. */
function scnClean(o, W, H, doc){
  var SW = Math.max(8, Math.round(W / 24)), SH = Math.max(8, Math.round(H / 24)), bg = new Float32Array(SW * SH), cnt = new Float32Array(SW * SH), i;
  var gr = new Float32Array(W * H);
  for(i = 0; i < W * H; i++) gr[i] = o[i*4] * 0.299 + o[i*4+1] * 0.587 + o[i*4+2] * 0.114;
  /* the paper is the BRIGHT part of each tile: take the max of each cell, then smooth */
  for(var y = 0; y < H; y++) for(var x = 0; x < W; x++){ var k = ((y * SH / H) | 0) * SW + ((x * SW / W) | 0); if(gr[y*W+x] > bg[k]) bg[k] = gr[y*W+x]; }
  for(var pass = 0; pass < 2; pass++){ var nb = new Float32Array(SW * SH);
    for(var ty = 0; ty < SH; ty++) for(var tx = 0; tx < SW; tx++){ var s = 0, n = 0;
      for(var yy = -1; yy <= 1; yy++) for(var xx = -1; xx <= 1; xx++){ var X2 = tx + xx, Y2 = ty + yy; if(X2 < 0 || Y2 < 0 || X2 >= SW || Y2 >= SH) continue; s += bg[Y2 * SW + X2]; n++; }
      nb[ty * SW + tx] = s / n; }
    bg = nb; }
  for(y = 0; y < H; y++){ var fy = Math.min(SH - 1.001, Math.max(0, y * SH / H - 0.5)), y0 = fy | 0, wy = fy - y0;
    for(x = 0; x < W; x++){ var fx = Math.min(SW - 1.001, Math.max(0, x * SW / W - 0.5)), x0 = fx | 0, wx = fx - x0;
      var B = (bg[y0*SW+x0] * (1-wx) + bg[y0*SW+x0+1] * wx) * (1-wy) + (bg[(y0+1)*SW+x0] * (1-wx) + bg[(y0+1)*SW+x0+1] * wx) * wy;
      var v = Math.min(1, gr[y*W+x] / Math.max(40, B));
      if(doc) v = v > 0.92 ? 1 : Math.pow(v / 0.92, 1.8);
      var px = Math.round(v * 255), di = (y * W + x) * 4; o[di] = o[di+1] = o[di+2] = px; } }
}
function scnToJpeg(canvas){ return new Promise(function(res){ canvas.toBlob(function(b){ res(b); }, 'image/jpeg', 0.82); }); }
async function scnKeep(){
  if(!cur) return;
  scnBusy(true);
  try{
    var page = scnRender(cur, mode), blob = /** @type {Blob} */ (await scnToJpeg(page));
    pages.push({ w: page.width, h: page.height, jpg: new Uint8Array(await blob.arrayBuffer()), thumb: page.toDataURL('image/jpeg', 0.5) });
    var tb = ROOT.querySelector('.scn-thumbs'); var im = scnEl('img'); im.src = pages[pages.length - 1].thumb; im.alt = 'Page ' + pages.length; tb.appendChild(im);
    cur = null; scnLayout();
  }finally{ scnBusy(false); }
}
/* A PDF with one Letter-width page per image, each image a DCTDecode XObject drawn to fill the page. */
function scnMakePdf(list){
  var enc = new TextEncoder(), chunks = [], len = 0, offs = [];
  var scnPush = function(u){ chunks.push(u); len += u.length; };
  var scnStr = function(s){ scnPush(enc.encode(s)); };
  var scnObj = function(n, body){ offs[n] = len; scnStr(n + ' 0 obj\n'); body(); scnStr('\nendobj\n'); };
  scnStr('%PDF-1.4\n%âãÏÓ\n');
  var N = list.length, kids = [];
  for(var i = 0; i < N; i++) kids.push((3 + i * 3) + ' 0 R');
  scnObj(1, function(){ scnStr('<< /Type /Catalog /Pages 2 0 R >>'); });
  scnObj(2, function(){ scnStr('<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>'); });
  list.forEach(function(p, i){
    var pw = 612, ph = Math.round(612 * p.h / p.w), pn = 3 + i * 3, im = pn + 1, cn = pn + 2;
    var cs = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    scnObj(pn, function(){ scnStr('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + cn + ' 0 R >>'); });
    scnObj(im, function(){ scnStr('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpg.length + ' >>\nstream\n'); scnPush(p.jpg); scnStr('\nendstream'); });
    scnObj(cn, function(){ scnStr('<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream'); });
  });
  var x = len, n = 3 + N * 3, xr = 'xref\n0 ' + n + '\n0000000000 65535 f \n';
  for(i = 1; i < n; i++) xr += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  scnStr(xr + 'trailer\n<< /Size ' + n + ' /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF\n');
  return new Blob(chunks, { type: 'application/pdf' });
}
function scnTell(m){ if(typeof window.crTell === 'function') window.crTell(m); else alert(m); }
async function scnFinish(){
  if(cur) await scnKeep();
  if(!pages.length){ scnTell('Take a photo of the page first.'); return; }
  scnBusy(true);
  try{
    var d = new Date(), stamp = (d.getMonth() + 1) + '-' + d.getDate() + ' ' + d.toTimeString().slice(0, 5).replace(':', '.');
    var file = new File([scnMakePdf(pages)], 'Scan ' + stamp + (pages.length > 1 ? ' (' + pages.length + ' pages)' : '') + '.pdf', { type: 'application/pdf' });
    var cb = onDone; scnClose();
    if(cb) cb(file);
  }finally{ if(ROOT) scnBusy(false); }
}
function scnClose(){
  if(!ROOT) return;
  ROOT.classList.remove('open'); pages = []; cur = null; onDone = null;
  var tb = ROOT.querySelector('.scn-thumbs'); if(tb) tb.innerHTML = '';
  scnLayout();
}
function scnOpen(firstFile, done){
  scnBuild(); pages = []; cur = null; onDone = done || null; mode = 'doc';
  ROOT.querySelectorAll('[data-scnmode]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-scnmode') === 'doc'); });
  ROOT.classList.add('open');
  if(firstFile) scnLoadPhoto(firstFile); else camInput.click();
}
window.CardinalScan = Object.assign(window.CardinalScan || {}, { open: scnOpen, close: scnClose, _findCorners: scnFindCorners, _render: scnRender, _makePdf: scnMakePdf });
})();
</script>
